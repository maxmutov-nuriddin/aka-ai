<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Jigar">
  <!-- Jigar belgisi: robot-ustozning boshi (web/shared/avatar.js bilan bir uslub) — oq dubulg'a, qorong'i ekran-yuz,
       yonib turgan ko'zlar va tabassum, antenna. Fon — tekis brend binafsha (#7c74ff). -->
  <defs>
    <linearGradient id="jg-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e3e3f6" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="#7c74ff" />
  <!-- antenna -->
  <rect x="61.5" y="20" width="5" height="14" rx="2.5" fill="#ffffff" />
  <circle cx="64" cy="18" r="7.5" fill="#ffffff" />
  <circle cx="64" cy="18" r="4" fill="#7c74ff" />
  <!-- quloqlar -->
  <rect x="15" y="56" width="13" height="27" rx="6.5" fill="#ffffff" />
  <rect x="100" y="56" width="13" height="27" rx="6.5" fill="#ffffff" />
  <rect x="19" y="62" width="5" height="15" rx="2.5" fill="#7c74ff" />
  <rect x="104" y="62" width="5" height="15" rx="2.5" fill="#7c74ff" />
  <!-- bosh va ekran-yuz -->
  <rect x="24" y="32" width="80" height="72" rx="30" fill="url(#jg-head)" />
  <rect x="32" y="42" width="64" height="50" rx="22" fill="#0b0e22" />
  <rect x="44" y="53" width="13" height="17" rx="6" fill="#5ff5dc" />
  <rect x="71" y="53" width="13" height="17" rx="6" fill="#5ff5dc" />
  <ellipse cx="41" cy="77" rx="4.5" ry="2.6" fill="#ff7ab6" opacity="0.5" />
  <ellipse cx="87" cy="77" rx="4.5" ry="2.6" fill="#ff7ab6" opacity="0.5" />
  <path d="M56 77q8 6 16 0" fill="none" stroke="#5ff5dc" stroke-width="4.5" stroke-linecap="round" />
</svg>
