<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirish — Jigar</title>
  <link rel="icon" href="/shared/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/shared/theme.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      background: radial-gradient(60% 50% at 50% 30%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%), var(--bg); color: var(--text);
      font-family: var(--font-body, system-ui, sans-serif); }
    .card { width: min(380px, 100%); display: grid; gap: 14px; padding: 28px 24px; border-radius: 20px;
      background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45); }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 40px; height: 40px; }
    h1 { margin: 0; font: 800 20px/1.2 var(--font-display, inherit); }
    p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
    input { padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); color: var(--text); font: inherit; }
    button { padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink, #fff); font: 700 15px/1 inherit; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error { color: var(--danger, #ff5d6c); font-size: 13px; min-height: 1em; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <!-- EcoSystem: yagona egasi — faqat parol. Birinchi ochilishda parol qo'yiladi; shu kompyuterda (ECO_LOCAL_NOAUTH=1) — parolsiz. -->
  <form class="card" id="form" autocomplete="on">
    <div class="brand"><img src="/shared/logo.svg" alt=""><h1 id="title">Jigar</h1></div>
    <p id="hint">Yuklanmoqda…</p>
    <label id="nameRow" hidden>Ismingiz (ixtiyoriy)
      <input id="name" type="text" maxlength="60" autocomplete="name">
    </label>
    <label>Parol
      <input id="password" type="password" minlength="8" required autocomplete="current-password">
    </label>
    <label id="repeatRow" hidden>Parolni takrorlang
      <input id="repeat" type="password" minlength="8" autocomplete="new-password">
    </label>
    <button type="submit" id="submit">Kirish</button>
    <p class="error" id="error" role="alert"></p>
  </form>
  <script type="module" src="/auth/auth.js"></script>
</body>
</html>
