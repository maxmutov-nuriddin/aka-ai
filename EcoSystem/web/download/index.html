<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jigar — yuklab olish</title>
  <link rel="icon" href="/shared/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/shared/theme.css">
  <style>
    body { margin: 0; min-height: 100vh; padding: 24px 16px 48px; box-sizing: border-box; color: var(--text);
      background: radial-gradient(60% 40% at 50% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%), var(--bg);
      font-family: var(--font-body, system-ui, sans-serif); }
    main { width: min(880px, 100%); margin: 0 auto; display: grid; gap: 20px; }
    header { display: flex; align-items: center; gap: 12px; }
    header img { width: 48px; height: 48px; }
    h1 { margin: 0; font: 800 26px/1.15 var(--font-display, inherit); }
    .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
    .card { display: grid; gap: 10px; align-content: start; padding: 18px; border-radius: 18px;
      background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); }
    .card.mine { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 18px 50px rgba(0, 0, 0, 0.35); }
    .card h2 { margin: 0; font: 800 18px/1.2 var(--font-display, inherit); display: flex; gap: 8px; align-items: center; }
    .meta { color: var(--muted); font-size: 12px; word-break: break-all; }
    .btn { display: inline-block; text-align: center; padding: 11px 14px; border-radius: 12px; font-weight: 700; text-decoration: none;
      background: var(--accent); color: var(--accent-ink, #fff); }
    .btn[aria-disabled="true"] { background: var(--glass); color: var(--muted); pointer-events: none; }
    details { font-size: 13px; color: var(--muted); line-height: 1.5; }
    summary { cursor: pointer; color: var(--text); }
    ol { margin: 6px 0 0; padding-left: 18px; }
    .qr { display: flex; gap: 16px; align-items: center; padding: 16px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line); }
    .qr img { width: 132px; height: 132px; background: #fff; border-radius: 10px; padding: 6px; flex: none; }
    .qr p { margin: 0; font-size: 14px; line-height: 1.5; }
    .qr code { word-break: break-all; }
    a.back { color: var(--muted); font-size: 13px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <!-- Ilovalarni yuklab olish (download.js): /api/downloads dan ro'yxat, OS bo'yicha mos karta tepada. -->
  <main>
    <header>
      <img src="/shared/logo.svg" alt="">
      <div>
        <h1>Jigar ilovalari</h1>
        <p class="sub" id="version">Kompyuter va telefon uchun</p>
      </div>
    </header>
    <section class="qr" id="qrBox" hidden>
      <img id="qrImg" alt="Telefon uchun QR-kod">
      <p>Telefonda kamerani shu QR-kodga qarating — yuklab olish sahifasi ochiladi (telefon va kompyuter bir Wi-Fi'da bo'lsin).<br><code id="lanUrl"></code></p>
    </section>
    <div class="grid" id="cards"></div>
    <a class="back" href="/app/">← Jigar'ga qaytish</a>
  </main>
  <script type="module" src="/download/download.js"></script>
</body>
</html>
